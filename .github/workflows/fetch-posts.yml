name: Fetch Draft Posts

on:
  schedule:
    # 10:00 UTC = 6am ET during daylight saving (EDT, UTC-4).
    # Drifts to 5am ET during standard time (EST, UTC-5) — GitHub Actions
    # cron doesn't adjust for DST. Revisit twice a year if exact timing matters.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run fetch:posts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
